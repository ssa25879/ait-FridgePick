name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=1
      - run: npm run test:scripts
      - run: npm run build
      - name: Check test ad bundle
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readdir, readFile } from 'node:fs/promises';
          const files = (await readdir('dist/assets')).filter(name => name.endsWith('.js'));
          const bundles = await Promise.all(files.map(name => readFile(`dist/assets/${name}`, 'utf8')));
          assert(bundles.some(text => text.includes('ait-ad-test-banner-id')));
          assert(!bundles.some(text => /ait\.v2\.live\.[a-f0-9]{16}/.test(text)));
          NODE
